<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Deficientezinho: um passeio do caralho</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="960" height="540" aria-label="Deficientezinho"></canvas>
    <div id="touch" hidden>
      <div class="pad left">
        <button id="tl" aria-label="←">&#9664;</button>
        <button id="tr" aria-label="→">&#9654;</button>
      </div>
      <div class="pad right">
        <button id="tb" aria-label="Turbo">&#9889;</button>
        <button id="th" aria-label="↑">&#9650;</button>
      </div>
    </div>
  </div>
  <noscript>Este jogo precisa de JavaScript. / This game needs JavaScript.</noscript>

  <script src="js/i18n.js"></script>
  <script src="js/level1.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/render.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
